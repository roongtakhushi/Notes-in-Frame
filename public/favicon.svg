<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="128" height="128" rx="28" fill="#FFFFFF" />

  <!-- "Snap" The Camera IP Character (Two primary colors: Sky Blue #407ADD and Daisy Pink #DD88C1) -->
  <g filter="url(#softShadow)">
    <!-- Main Camera Body (Sky Blue with rounded chunky forms) -->
    <rect x="18" y="38" width="92" height="74" rx="20" fill="#407ADD" />

    <!-- Top Viewfinder / Flash Bump -->
    <path d="M 42 38 L 48 26 C 50 22 54 20 60 20 L 68 20 C 74 20 78 22 80 26 L 86 38 Z" fill="#407ADD" />
    <rect x="54" y="24" width="20" height="10" rx="4" fill="#DD88C1" />

    <!-- Big Center Lens Assembly (Daisy Pink with dark lens aperture) -->
    <circle cx="64" cy="76" r="28" fill="#DD88C1" />
    <circle cx="64" cy="76" r="22" fill="#1E293B" />
    <circle cx="64" cy="76" r="16" fill="#0F172A" />

    <!-- Friendly Cheerful Eyes (Inside the lens reflection) -->
    <circle cx="58" cy="72" r="4.5" fill="#FFFFFF" />
    <circle cx="70" cy="72" r="4.5" fill="#FFFFFF" />
    <circle cx="59.5" cy="73.5" r="2" fill="#407ADD" />
    <circle cx="71.5" cy="73.5" r="2" fill="#407ADD" />

    <!-- Cute Cheerful Smile -->
    <path d="M 60 80 Q 64 84 68 80" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Cute Rosy Cheeks -->
    <circle cx="50" cy="79" r="3.5" fill="#DD88C1" opacity="0.8" />
    <circle cx="78" cy="79" r="3.5" fill="#DD88C1" opacity="0.8" />

    <!-- Shutter Button (Brand Green #89BC62) -->
    <rect x="28" y="30" width="14" height="8" rx="3" fill="#89BC62" />

    <!-- Vintage Film Ejection Slot at Bottom -->
    <rect x="36" y="104" width="56" height="4" rx="2" fill="#1E293B" />

    <!-- Little Polaroid Print Peeking Out -->
    <rect x="44" y="106" width="40" height="12" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <rect x="48" y="108" width="32" height="6" fill="#89BC62" opacity="0.4" />
  </g>
</svg>
